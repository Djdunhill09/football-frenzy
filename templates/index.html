<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Football Frenzy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <canvas id="game" width="800" height="450"></canvas>
  <div id="score-panel">
    <form id="score-form" hidden>
      <p id="score-final"></p>
      <label for="score-name">Your name</label>
      <input id="score-name" type="text" maxlength="20" autocomplete="off" required>
      <button type="submit">Submit score</button>
      <p id="score-message" role="status"></p>
    </form>
    <h2>High Scores</h2>
    <ol id="score-list"></ol>
  </div>
  <script src="{{ url_for('static', filename='js/input.js') }}"></script>
  <script src="{{ url_for('static', filename='js/world.js') }}"></script>
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hud.js') }}"></script>
  <script src="{{ url_for('static', filename='js/renderer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/scores.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
